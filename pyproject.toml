[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pqc-factory"
version = "0.1.0"
description = "Production-Qualified Change Factory – Multi-agent system that turns tickets into production-ready PRs using Nebius Token Factory Sandboxes + Nemotron models"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "PQC Factory Team" }
]
keywords = ["agentic", "coding-agent", "nebius", "nemotron", "sandbox", "langgraph"]
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "rich>=13.0",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
pqc = "pqc_factory.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["pqc_factory"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["pqc_factory/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
